services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-tagore}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-tagore}"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./packages/backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://raguser:ragpass@postgres:5432/tagore
      RCA_READONLY_DATABASE_URL: postgresql://rca_readonly:rcareadonly@postgres:5432/tagore
      OLLAMA_BASE_URL: http://host.docker.internal:11444
      # Bind mounts on Docker Desktop do not emit inotify events.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "9099:8000"
    volumes:
      - ./packages/backend/app:/app/app
      - ./corpus:/app/corpus:ro
      - ./eval/golden_qa.json:/app/eval/golden_qa.json:ro
      - rca_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./packages/frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5183"]
    environment:
      VITE_API_BASE_URL: http://localhost:9099
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5183:5183"
    volumes:
      # Source from the host. node_modules stays the Linux tree from the image.
      - ./packages/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  rca_logs:
  frontend_node_modules:
